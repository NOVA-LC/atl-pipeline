# Dialer service config. Overrides root atl-pipeline/railway.toml for this service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "gunicorn --workers 1 --worker-class gthread --threads 16 --timeout 0 --bind 0.0.0.0:${PORT:-5050} server:app"
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
